<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>multiarena</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

      /* Dark theme (default) */
      :root, [data-theme="dark"] {
        --bg: #0d1117;
        --surface: #161b22;
        --card: #21262d;
        --border: #30363d;
        --text: #c9d1d9;
        --text-dim: #8b949e;
        --primary: #7c3aed;
        --primary-hover: #6d28d9;
        --accent: #10b981;
        --error: #ef4444;
        --glass-bg: rgba(13, 17, 23, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      /* Light theme */
      [data-theme="light"] {
        --bg: #fafbfc;
        --surface: #ffffff;
        --card: #f3f4f6;
        --border: #d1d5db;
        --text: #1a1a2e;
        --text-dim: #6b7280;
        --primary: #7c3aed;
        --primary-hover: #6d28d9;
        --accent: #059669;
        --error: #dc2626;
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 0, 0, 0.08);
        --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      }

      html {
        background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
        color: var(--text);
      }
      /* Light theme gradient override (data-theme is on <html>) */
      [data-theme="light"] {
        background: linear-gradient(135deg, #f0f2f5 0%, #fafbfc 50%, #e8ecf1 100%);
      }

      /* Glass morphism */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        box-shadow: var(--glass-shadow);
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--surface); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- __INITIAL_STATE__ -->
  </body>
</html>
