<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <!-- Model A (purple) -->
  <circle cx="24" cy="28" r="10" fill="url(#g1)" opacity="0.9"/>
  <text x="24" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="system-ui">A</text>
  <!-- Model B (blue) -->
  <circle cx="40" cy="28" r="10" fill="url(#g2)" opacity="0.9"/>
  <text x="40" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="system-ui">B</text>
  <!-- Overlap connection line -->
  <line x1="34" y1="28" x2="24" y2="36" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
  <line x1="30" y1="28" x2="40" y2="36" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
  <!-- Output dot -->
  <circle cx="32" cy="42" r="3" fill="#10b981"/>
</svg>
